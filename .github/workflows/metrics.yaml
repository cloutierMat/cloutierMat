name: Metrics

on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["master", "main"] }

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: gh-metrics/metrics@727b269a0e1af233e88b535a7555bb736e54b4b2
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: cloutierMat
          template: classic
          config_timezone: America/Edmonton
          filename: metrics.svg

          base_indepth: yes

      - uses: gh-metrics/metrics@727b269a0e1af233e88b535a7555bb736e54b4b2
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: cloutierMat
          template: classic
          config_timezone: America/Edmonton
          filename: iso-calendar.svg

          base: ""

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - uses: gh-metrics/metrics@727b269a0e1af233e88b535a7555bb736e54b4b2
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: cloutierMat
          template: classic
          config_timezone: America/Edmonton
          filename: habits.svg

          base: ""

          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 364
          plugin_habits_facts: yes
          plugin_habits_from: 1000
          plugin_habits_languages_limit: 8
